name: Build Zisus Bible Display EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm install
        
      - name: Package Windows EXE
        run: npm run package
        
      - name: Upload EXE Output
        uses: actions/upload-artifact@v4
        with:
          name: ZisusBibleDisplay-Windows
          path: dist/ZisusBibleDisplay-win32-x64/
